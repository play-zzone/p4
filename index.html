// داخل index.html — داخل <script> tag(async function initPZ() {
  const READY_KEY = 'pz_cache_ready_v52';

  // ── status bar ──────────────────────────────────────────────
  function ui(html, color) {
    let el = document.getElementById('_pz_status');
    if (!el) {
      el = document.createElement('div');
      el.id = '_pz_status';
      Object.assign(el.style, {
        position:'fixed', bottom:'20px', left:'50%',
        transform:'translateX(-50%)',
        background:'rgba(0,0,0,0.92)', padding:'14px 28px',
        borderRadius:'10px', fontFamily:'monospace', fontSize:'14px',
        zIndex:'9999', textAlign:'center', maxWidth:'88vw',
        lineHeight:'1.7', border:'1px solid #f0c040',
        boxShadow:'0 0 20px rgba(240,192,64,0.2)',
      });
      document.body.appendChild(el);
    }
    el.style.color = color || '#f0c040';
    el.innerHTML   = html;
  }

  // ── progress bar ────────────────────────────────────────────
  function uiProgress(done, total) {
    const pct  = total ? Math.round((done / total) * 100) : 0;
    const fill = Math.round(pct / 5); // 0-20 blocks
    const bar  = '█'.repeat(fill) + '░'.repeat(20 - fill);
    ui(
      `⬇️ جاري تحميل الملفات للأوفلاين...<br>
       <span style="color:#fff;font-size:16px">${bar}</span><br>
       <b>${done} / ${total}</b> — ${pct}%`,
      '#f0c040'
    );
  }

  // ── firmware → chain map ────────────────────────────────────
  /* ---- local modification (PLAYZZONE-GOLD) ----
     ps4_offsets.js declares 13.02 and 13.04 as alias_of 13.00 with bug=poops
     and kpatch=1302.bin / 1304.bin. The original map routed both of them to
     jb.html, which loads chain_lapse -- a different chain from the one the
     offsets were written for. The WebKit side is identical to 13.00 (no
     13.02/13.04 module dump exists), so run_poops is the correct target. */
  const CHAIN_MAP = {
    '11.00':'run_poops.html?ui=3',
    '11.50':'run_poops.html?ui=3',
    '12.00':'run_poops.html?ui=3',
    '12.02':'run_poops.html?ui=3',
    '12.50':'run_poops.html?ui=3',
    '12.52':'run_poops.html?ui=3',
    '13.00':'run_poops.html?ui=3',
    '13.02':'run_poops.html?ui=3',
    '13.04':'run_poops.html?ui=3',
    '13.50':'jb.html?log=1',
    '13.52':'jb.html?log=1',
    '9.00' :'run_psfree.html?ui=3',
  };

  function goChain() {
    const ver    = (navigator.userAgent.match(/PlayStation 4\/([\d.]+)/) || [])[1] || '';
    const target = CHAIN_MAP[ver];
    if (target) {
      ui('🚀 جاري التفعيل...', '#44ff88');
      setTimeout(() => window.location.replace(target), 400);
      return;
    }
    // unknown / no UA
    ui(
      ver
        ? `⛔ فيرموير ${ver} غير مدعوم`
        : '❓ تعذّر قراءة الفيرموير — اختر الچين يدوياً',
      '#ff9900'
    );
    showPicker();
  }

  function showPicker() {
    const wrap = document.createElement('div');
    Object.assign(wrap.style, {
      position:'fixed', top:'50%', left:'50%',
      transform:'translate(-50%,-50%)',
      background:'#1a1a1a', border:'2px solid #f0c040',
      borderRadius:'14px', padding:'28px 32px',
      zIndex:'10001', textAlign:'center',
      color:'#fff', fontFamily:'monospace',
    });
    wrap.innerHTML = `<div style="color:#f0c040;font-size:18px;margin-bottom:16px">اختر الچين</div>`;
    [
      ['Chain A — 11.00 → 13.04','run_poops.html?ui=3'],
      ['Chain B — 13.50 → 13.52','jb.html?log=1'],
      ['Chain C — 9.00','run_psfree.html?ui=3'],
    ].forEach(([label, href]) => {
      const btn = document.createElement('button');
      btn.textContent = label;
      Object.assign(btn.style, {
        display:'block', width:'100%', margin:'8px 0',
        padding:'12px', background:'#f0c040', color:'#000',
        border:'none', borderRadius:'8px', cursor:'pointer',
        fontFamily:'monospace', fontWeight:'bold', fontSize:'14px',
      });
      btn.onclick = () => location.replace(href);
      wrap.appendChild(btn);
    });
    document.body.appendChild(wrap);
  }

  // ── no SW support ────────────────────────────────────────────
  if (!('serviceWorker' in navigator)) {
    ui('⚠️ المتصفح لا يدعم الأوفلاين', '#ff9900');
    goChain();
    return;
  }

  // ── register ─────────────────────────────────────────────────
  let reg;
  try {
    reg = await navigator.serviceWorker.register('./sw.js', { scope: './' });
  } catch (err) {
    ui(`❌ فشل تسجيل SW:<br>${err.message}`, '#ff4444');
    return;
  }

  // ── SW messages ──────────────────────────────────────────────
  navigator.serviceWorker.addEventListener('message', ({ data }) => {
    switch (data.type) {

      case 'CACHE_PROGRESS':
        uiProgress(data.done, data.total);
        break;

      case 'CACHE_READY':
        localStorage.setItem(READY_KEY, '1');
        ui(
          '✅ تم تحميل جميع الملفات للأوفلاين!<br>' +
          '<span style="color:#aaa;font-size:12px">' +
          'أغلق المتصفح تماماً ← شغّل الواي فاي ← افتح الصفحة من جديد' +
          '</span>',
          '#44ff88'
        );
        break;

      case 'CACHE_FAIL':
        localStorage.removeItem(READY_KEY);
        ui(
          `❌ فشل تحميل الملفات التالية:<br>` +
          `<span style="font-size:11px;color:#ffaaaa">` +
          data.failed.slice(0, 6).join('<br>') +
          (data.failed.length > 6 ? `<br>...وغيرها` : '') +
          `</span>`,
          '#ff4444'
        );
        break;

      case 'CACHE_STATUS':
        if (data.ready) {
          ui(`✅ الكاش مكتمل (${data.cached}/${data.total})`, '#44ff88');
          setTimeout(goChain, 600);
        } else {
          localStorage.removeItem(READY_KEY);
          ui(
            `⚠️ الكاش ناقص — ${data.missing.length} ملف مفقود<br>` +
            `<span style="font-size:11px;color:#ffcc00">` +
            data.missing.slice(0, 4).join('<br>') + `</span><br>` +
            `<span style="font-size:11px;color:#aaa">تأكد من الاتصال وأعد تحميل الصفحة</span>`,
            '#ff9900'
          );
        }
        break;

      case 'MISSING_FILE':
        console.warn('[PZ] missing:', data.url);
        break;
    }
  });

  // ── wait for SW active ───────────────────────────────────────
  await navigator.serviceWorker.ready;

  const sw = reg.active ?? reg.waiting ?? reg.installing;

  // ── already cached? verify first ────────────────────────────
  if (localStorage.getItem(READY_KEY) === '1') {
    ui('🔍 التحقق من الكاش...', '#aaaaaa');
    sw.postMessage({ type: 'CHECK_CACHE' });
    return;
  }

  // ── first visit: show progress immediately ───────────────────
  /* Total updated to match sw.js CORE length after adding kpatch/900.elf. */
  uiProgress(0, 47);

  if (reg.installing) {
    await new Promise(resolve => {
      reg.installing.addEventListener('statechange', function h(e) {
        if (e.target.state === 'activated') {
          e.target.removeEventListener('statechange', h);
          resolve();
        }
      });
    });
  }

  // verify after install
  const activeSW = reg.active;
  if (activeSW) activeSW.postMessage({ type: 'CHECK_CACHE' });})();
